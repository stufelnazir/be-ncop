# Development environment
spring.mongodb.uri=${MONGODB_URI_DEV}
spring.mongodb.database=${MONGODB_DATABASE_DEV:dev}
server.port=8080

gcp.storage.bucket-name=${GCS_BUCKET_NAME:}
gcp.storage.project-id=${GCS_PROJECT_ID:}
gcp.storage.credentials-path=${GCS_CREDENTIALS_PATH:}

# Multipart File Size Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB